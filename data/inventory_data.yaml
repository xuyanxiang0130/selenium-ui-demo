inventory_cases:
  # 主干：进入商品页校验页面 → smoke
  - case_name: 校验商品页基础信息
    action: check_page_info
    expect_title: "Products"
    expect_goods_num: 6
    tag: smoke
  # 次要功能 → 归为回归，不进冒烟
  - case_name: 商品名称升序排序校验
    action: sort_name_asc
    expect_first_name: "Sauce Labs Backpack"
    tag: regression
  - case_name: 商品价格升序排序校验
    action: sort_price_asc
    expect_first_price: "$7.99"
    tag: regression
